name: dict
description: "现代英汉/汉英离线词典：离线词库、多源发音、Material You 主题、通知栏查词"
publish_to: 'none'
version: 1.0.4+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── 状态管理与路由 ──
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0

  # ── 本地存储 ──
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  path: ^1.9.0

  # ── 发音 ──
  edge_tts: ^0.1.5
  flutter_tts: ^4.2.5

  # ── 网络 ──
  http: ^1.6.0

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  dynamic_color: ^1.9.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/dict.sqlite.gz
